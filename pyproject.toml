[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hangzhou-pinn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "torch", "deepxde", "scikit-fem", "matplotlib", "gmsh"]

[project.optional-dependencies]
fast-sparse = ["pypardiso>=0.4.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
